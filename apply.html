<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참여 신청 | MY YOUTH</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f6f7fa;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{max-width:760px;margin:auto;padding:28px 20px 100px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 50px}header a{color:white;text-decoration:none}.logo{font:700 35px Georgia,serif}.kicker{letter-spacing:.23em;color:#a7b8e7;font-size:12px}h1{font-size:clamp(31px,7vw,55px);letter-spacing:-.06em;line-height:1.28;margin:16px 0}p{color:#bdc6d6;line-height:1.8}.card{background:#151d31;border:1px solid #34405a;border-radius:22px;padding:24px;margin-top:35px}.section{font-size:19px;font-weight:700;margin:24px 0 18px}.field{margin:17px 0}label{display:block;font-size:13px;margin-bottom:9px;font-weight:650}input,select,textarea{width:100%;background:#0d1424;color:white;border:1px solid #4a5670;border-radius:10px;padding:14px;font-size:16px;font-family:inherit}textarea{min-height:140px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #7ba4ff}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{border-top:1px solid #334057;margin:30px 0}.consent{display:flex;gap:10px;align-items:flex-start;line-height:1.6;font-size:13px}.consent input{width:18px;height:18px;flex:none}.notice{font-size:12px;color:#9ba7bd}.submit{width:100%;border:0;border-radius:12px;background:#f8e766;color:#101323;font-size:17px;font-weight:800;padding:17px;margin-top:22px;cursor:pointer}.submit:disabled{opacity:.5}.status{font-size:13px;margin-top:16px}.required{color:#f8e766}@media(max-width:450px){.two{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><main><header><a class="logo" href="index.html">my youth</a><a href="index.html">← 전시로 돌아가기</a></header><div class="kicker">JOIN THE EXHIBITION · 2026</div><h1>당신의 작품을<br>기다립니다.</h1><p>다양한 전공의 대학생들이 팀을 이루어 하나의 온라인 전시를 완성합니다. 자유로운 아이디어를 들려주세요.</p><form class="card" id="apply"><div class="section">01. 기본 정보</div><div class="field"><label>이름 <span class="required">*</span></label><input name="name" required maxlength="40" autocomplete="name" placeholder="이름"></div><div class="two"><div class="field"><label>나이 <span class="required">*</span></label><input name="age" type="number" required min="15" max="100" placeholder="만 나이"></div><div class="field"><label>성별 (선택)</label><select name="gender"><option value="">응답하지 않음</option><option>남성</option><option>여성</option><option>기타</option></select></div></div><div class="line"></div><div class="section">02. 학교 및 전공</div><div class="field"><label>학교 <span class="required">*</span></label><input name="school" required maxlength="100" placeholder="대학교 이름"></div><div class="two"><div class="field"><label>학년 <span class="required">*</span></label><select name="grade" required><option value="">학년 선택</option><option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>5학년 이상</option><option>휴학</option><option>졸업유예</option></select></div><div class="field"><label>전공 <span class="required">*</span></label><input name="major" required maxlength="100" placeholder="전공명"></div></div><div class="line"></div><div class="section">03. 거주 지역</div><div class="two"><div class="field"><label>시·도 <span class="required">*</span></label><select name="city" id="city" required><option value="">시·도 선택</option></select></div><div class="field"><label>시·군·구 <span class="required">*</span></label><select name="district" id="district" required disabled><option value="">시·군·구 선택</option></select></div></div><div class="line"></div><div class="section">04. 창작 활동</div><div class="field"><label>관심 분야 <span class="required">*</span></label><select name="field" required><option value="">관심 분야 선택</option><option>디자인 · 일러스트</option><option>개발 · UX/UI</option><option>영상 · 모션그래픽</option><option>기획 · 스토리텔링</option><option>사운드 · 음악</option><option>게임 · 인터랙티브 콘텐츠</option><option>기타</option></select></div><div class="field"><label>만들고 싶은 작품 <span class="required">*</span></label><textarea name="idea" required maxlength="2000" placeholder="작품의 주제, 아이디어, 표현 방식 등을 자유롭게 적어주세요. 아직 구체적이지 않아도 괜찮아요."></textarea></div><div class="line"></div><div class="section">05. 연락처 및 동의</div><div class="field"><label>전화번호 <span class="required">*</span></label><input name="phone" type="tel" required pattern="0[0-9-]{8,13}" placeholder="010-0000-0000" autocomplete="tel"></div><p class="notice">개인정보 수집 목적: 프로젝트 참여 신청 검토 및 연락. 수집 항목: 위 입력 항목. 보관 기간 및 담당자 연락처는 실제 모집 전에 운영자가 확정하여 안내해야 합니다.</p><label class="consent"><input name="consent" type="checkbox" required value="동의"><span>개인정보 수집 및 이용에 동의합니다. (필수)</span></label><button class="submit" type="submit">참여 신청하기 ↗</button><div class="status" id="status" role="status"></div></form></main><script>
// Apps Script 웹 앱 배포 URL을 입력하세요. 예: https://script.google.com/macros/s/.../exec
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzIO7u8dhHM_aO7FjlUFYok2WEYNkRxRWqC_yiUR63e2c_cHEHZ-JVUjl8AGP8Z5G-E/exec';
const regions = {"서울특별시":"종로구 중구 용산구 성동구 광진구 동대문구 중랑구 성북구 강북구 도봉구 노원구 은평구 서대문구 마포구 양천구 강서구 구로구 금천구 영등포구 동작구 관악구 서초구 강남구 송파구 강동구","부산광역시":"중구 서구 동구 영도구 부산진구 동래구 남구 북구 해운대구 사하구 금정구 강서구 연제구 수영구 사상구 기장군","대구광역시":"중구 동구 서구 남구 북구 수성구 달서구 달성군 군위군","인천광역시":"중구 동구 미추홀구 연수구 남동구 부평구 계양구 서구 강화군 옹진군","광주광역시":"동구 서구 남구 북구 광산구","대전광역시":"동구 중구 서구 유성구 대덕구","울산광역시":"중구 남구 동구 북구 울주군","세종특별자치시":"세종시","경기도":"수원시 성남시 의정부시 안양시 부천시 광명시 평택시 동두천시 안산시 고양시 과천시 구리시 남양주시 오산시 시흥시 군포시 의왕시 하남시 용인시 파주시 이천시 안성시 김포시 화성시 광주시 양주시 포천시 여주시 연천군 가평군 양평군","강원특별자치도":"춘천시 원주시 강릉시 동해시 태백시 속초시 삼척시 홍천군 횡성군 영월군 평창군 정선군 철원군 화천군 양구군 인제군 고성군 양양군","충청북도":"청주시 충주시 제천시 보은군 옥천군 영동군 증평군 진천군 괴산군 음성군 단양군","충청남도":"천안시 공주시 보령시 아산시 서산시 논산시 계룡시 당진시 금산군 부여군 서천군 청양군 홍성군 예산군 태안군","전북특별자치도":"전주시 군산시 익산시 정읍시 남원시 김제시 완주군 진안군 무주군 장수군 임실군 순창군 고창군 부안군","전라남도":"목포시 여수시 순천시 나주시 광양시 담양군 곡성군 구례군 고흥군 보성군 화순군 장흥군 강진군 해남군 영암군 무안군 함평군 영광군 장성군 완도군 진도군 신안군","경상북도":"포항시 경주시 김천시 안동시 구미시 영주시 영천시 상주시 문경시 경산시 의성군 청송군 영양군 영덕군 청도군 고령군 성주군 칠곡군 예천군 봉화군 울진군 울릉군","경상남도":"창원시 진주시 통영시 사천시 김해시 밀양시 거제시 양산시 의령군 함안군 창녕군 고성군 남해군 하동군 산청군 함양군 거창군 합천군","제주특별자치도":"제주시 서귀포시"};
const city=document.getElementById('city'),district=document.getElementById('district');Object.keys(regions).forEach(v=>city.add(new Option(v,v)));city.addEventListener('change',()=>{district.innerHTML='<option value="">시·군·구 선택</option>';district.disabled=!city.value;if(city.value)regions[city.value].split(' ').forEach(v=>district.add(new Option(v,v)))});
document.getElementById('apply').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status');if(!SCRIPT_URL){s.textContent='현재 신청 접수 준비 중입니다. Google Sheets 연결 후 신청할 수 있습니다.';return}const f=e.currentTarget;const data=Object.fromEntries(new FormData(f).entries());data.consent='true';if(!/^0[0-9-]{8,13}$/.test(data.phone)){s.textContent='전화번호를 확인해 주세요.';return}const b=f.querySelector('button');b.disabled=true;s.textContent='전송 중...';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});s.textContent='전송 요청이 완료됐습니다. 실제 접수 여부는 운영자의 구글 시트 확인이 필요합니다.'}catch(err){s.textContent='전송에 실패했습니다. 잠시 후 다시 시도해 주세요.'}finally{b.disabled=false}});
</script></body></html>
